[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-sim"
version = "0.1.0"
description = "Reference model for stellar contamination (TLSE) and Pandora joint-fit simulation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "astropy"]

[project.optional-dependencies]
dev = ["pytest", "batman-package", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
